name: Security Scan (reusable)

# Shared Gitleaks, Checkov, Trivy and zizmor jobs for every repo on this
# profile. Callers pin it by commit SHA:
#
#   jobs:
#     scan:
#       uses: DustyStudy/DustyStudy/.github/workflows/security-scan.yml@<sha>
#       permissions:
#         contents: read
#         security-events: write
#         actions: read

on:
  workflow_call:
    inputs:
      checkov:
        description: Run Checkov. Off for repos whose own CI already runs it.
        type: boolean
        default: true
      checkov-framework:
        description: Comma-separated Checkov frameworks. Empty scans all.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI, not gitleaks-action: the action scans <first PR commit>^..HEAD,
      # which fails on a PR that brings in another repo's root commit.
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Scan full history for secrets
        run: ./gitleaks git . --redact --verbose

  checkov:
    name: Misconfiguration (Checkov)
    if: inputs.checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Checkov (blocking)
        uses: bridgecrewio/checkov-action@5798bad4f6dd9c1fb67ae3ec10d42d8fb67037c4 # v12.3126.0
        with:
          directory: .
          framework: ${{ inputs.checkov-framework }}
          quiet: true
          soft_fail: false

  trivy:
    name: Vulnerabilities and misconfiguration (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # upload-sarif reads the workflow run to label the upload.
      actions: read
    env:
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CLI, not trivy-action: a checksum-verified release binary leaves
      # one less third-party action to trust.
      - name: Install trivy (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy

      - name: Run Trivy filesystem scan
        run: |
          "$RUNNER_TEMP/trivy" fs . --scanners vuln,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --skip-dirs .git --format sarif --output trivy-results.sarif --exit-code 0

      # Code scanning needs a public repo (or GitHub Advanced Security).
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-results.sarif') != '' && !github.event.repository.private
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-pinned wheel, same as a pinned action SHA.
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/zizmor.txt"

      # The token turns on the online audits: impostor commits, ref confusion
      # and actions with known vulnerabilities.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format github --min-severity medium .github'
