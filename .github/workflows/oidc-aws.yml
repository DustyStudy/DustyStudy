name: AWS OIDC check (reusable)

# Reference for assuming an AWS role from GitHub Actions with OIDC, and a
# smoke test that the role's trust policy accepts this repo. No access keys.
# The partition comes from the role ARN, so the same workflow serves
# commercial (arn:aws) and GovCloud (arn:aws-us-gov).
#
#   jobs:
#     aws:
#       uses: DustyStudy/DustyStudy/.github/workflows/oidc-aws.yml@<sha>
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         role-arn: ${{ vars.AWS_READONLY_ROLE_ARN }}
#         aws-region: us-gov-west-1
#
# Trust policy for the role (fill in the partition, account and repo):
#
#   "Principal": {"Federated": "arn:${Partition}:iam::${Account}:oidc-provider/token.actions.githubusercontent.com"},
#   "Action": "sts:AssumeRoleWithWebIdentity",
#   "Condition": {
#     "StringEquals": {
#       "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
#       "token.actions.githubusercontent.com:sub": "repo:DustyStudy/<repo>:ref:refs/heads/main"
#     }
#   }
#
# Use StringEquals, not StringLike: there is no wildcard to match. A job
# run by a pull request presents
# sub = repo:DustyStudy/<repo>:pull_request instead, so a role that runs
# `terraform plan` on PRs (terraform-ci.yml) must list that value too:
#   "token.actions.githubusercontent.com:sub": ["repo:DustyStudy/<repo>:ref:refs/heads/main", "repo:DustyStudy/<repo>:pull_request"]
# Keep that role read-only: the PR's Terraform code runs with its
# credentials. In a public repo the plan output is in public Actions logs,
# so run plans for real infrastructure from a private repo.

on:
  workflow_call:
    inputs:
      role-arn:
        description: IAM role ARN to assume (arn:aws:... or arn:aws-us-gov:...).
        type: string
        required: true
      aws-region:
        description: AWS region. GovCloud allows only us-gov-west-1 and us-gov-east-1.
        type: string
        required: true

permissions:
  contents: read

jobs:
  assume:
    name: Assume AWS role (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check partition and region
        env:
          ROLE_ARN: ${{ inputs.role-arn }}
          REGION: ${{ inputs.aws-region }}
        run: |
          partition=$(cut -d: -f2 <<<"$ROLE_ARN")
          case "$partition" in
            aws-us-gov)
              case "$REGION" in us-gov-west-1|us-gov-east-1) ;; *)
                echo "::error::GovCloud role needs region us-gov-west-1 or us-gov-east-1, got $REGION"; exit 1;; esac
              # STS (credentials action) and the AWS CLI both read this.
              echo "AWS_USE_FIPS_ENDPOINT=true" >> "$GITHUB_ENV" ;;
            aws)
              case "$REGION" in us-gov-*)
                echo "::error::Commercial role cannot use GovCloud region $REGION"; exit 1;; esac ;;
            *) echo "::error::Unsupported partition '$partition' in role-arn"; exit 1 ;;
          esac

      - name: Assume role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: oidc-check-${{ github.run_id }}

      - name: Show assumed identity
        run: aws sts get-caller-identity --query Arn --output text
